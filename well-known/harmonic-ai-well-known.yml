summary: >-
  Two real documents are served, both on the MCP host: RFC 8414 authorization-server metadata and
  RFC 9728 protected-resource metadata. That is a genuine WellKnown hit and the pointer is earned.
  Nothing else is served anywhere: no security.txt (so NO SecurityTxt pointer), no api-catalog, no
  ai-plugin.json, no OIDC discovery, and no A2A agent card.
pointer_basis: >-
  WellKnown pointer emitted on the strength of the two 200s on mcp.api.harmonic.ai. SecurityTxt
  pointer NOT emitted — RFC 9116 is unimplemented on every host.
false_positive_watch: >-
