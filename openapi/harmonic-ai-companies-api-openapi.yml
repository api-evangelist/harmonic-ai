          type: string
          description: Company LinkedIn profile URL.
          title: Linkedin Url
        description: Company LinkedIn profile URL.
        example: https://www.linkedin.com/company/facebook
      - name: website_url
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Company website URL.
          title: Website Url
        description: Company website URL.
        example: https://www.harmonic.ai
      - name: twitter_url
        in: query
        required: false
        schema:
          type: string
          description: Company twitter URL.
          title: Twitter Url
        description: Company twitter URL.
        example: twitter.com/facebook
      - name: crunchbase_url
        in: query
        required: false
