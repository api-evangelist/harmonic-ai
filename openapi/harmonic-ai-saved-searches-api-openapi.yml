          - type: integer
          - type: string
            format: uuid
          - type: string
          title: Id Or Urn
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: Page size
          default: 50
          title: Size
        description: Page size
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Cursor0 for pagination
          title: Cursor
        description: Cursor0 for pagination
      - name: new_results_since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: 'Filter results that are matches after this date(in UTC). Accepts date (YYYY-MM-DD) or datetime (YYYY-MM-DDTHH:00:00Z) formats. Examples: ''2024-03-20'' or ''2024-03-20T14:00:00Z''. When specified, returns all matching results regardless of their cleared status.'
          title: New Results Since
