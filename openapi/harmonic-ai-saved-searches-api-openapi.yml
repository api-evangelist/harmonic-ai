    InvestorTypeEnum:
      type: string
      enum:
      - VENTURE_CAPITAL
      - CORPORATE_VENTURE_CAPITAL
      - STRATEGIC_CORPORATE
      - ACCELERATOR_INCUBATOR
      - ANGEL_GROUP
      - INDIVIDUAL_ANGEL
      - VENTURE_STUDIO
      - GROWTH_EQUITY
      - PRIVATE_EQUITY
      - CROSSOVER_FUND
      - HEDGE_FUND
      - FAMILY_OFFICE
      - SOVEREIGN_WEALTH_FUND
      - PENSION_FUND
      - ENDOWMENT
      - INVESTMENT_BANK
      - ASSET_MANAGER
      - PRIVATE_DEBT
      - SECONDARY_FUND
      - FUND_OF_FUNDS
      - GOVERNMENT
      - OTHER
      - UNKNOWN
      description: 'Investor type categories:

        - VENTURE_CAPITAL: Institutional investment firms (typically LP/GP fund structures) that primarily make minority equity investments in early-stage, high-growth private companies. Often take board seats or observer rights and manage diversified portfolios across fund vintages. Fund lifecycles are typically 10+ years. Logic triggers: General Partner, Limited Partners, Fund I/II/vintage year, Seed/Series A/B, portfolio companies, board seat, priced equity rounds, carried interest. Examples: Kleiner Perkins, Sequoia Capital, Andreessen Horowitz, Union Square Ventures, First Round Capital.

        - CORPORATE_VENTURE_CAPITAL: A distinct investing unit inside or alongside an operating corporation. Use when the entity itself is a venture arm, investment arm, branded ventures/capital platform, dedicated subsidiary, or separately named investing vehicle. This includes entities such as ''[Parent] Ventures'' or ''[Parent] Capital'' when they function as the parent''s dedicated startup investing platform. Examples: Intel Capital, Qualcomm Ventures, Salesforce Ventures, GV, Microsoft M12.

        - STRATEGIC_CORPORATE: The parent operating company itself making direct strategic investments, without a separate venture arm or dedicated investing vehicle. Use when there is repeated direct-investment evidence on the parent entity, such as multiple associated startup investments, strategic stakes, or repeated funding-round participation across companies or years. The fact that an operating company does venture investing is not enough for CORPORATE_VENTURE_CAPITAL; use CORPORATE_VENTURE_CAPITAL only when the entity itself is a distinct investing unit. Do not use for a one-off or weak investing signal, and do not let generic operating-company website copy or loose third-party ''corporate venture capital'' wording outweigh strong repeated direct-investment evidence on the parent entity itself. Examples: Walmart, BMW, Pfizer, and similar parent-company entities investing directly rather than through branded venture subsidiaries.

        - ACCELERATOR_INCUBATOR: Organizations running structured, time-bound programs (often cohort-based) providing mentorship, resources, and typically a small initial investment (5-10% equity) in exchange for participation. Programs culminate in demo days or structured investor exposure. Logic triggers: cohort, batch, application cycle, demo day, mentorship program, 3-6 month program, SAFE, standard deal terms. Examples: Y Combinator, Techstars, Plug and Play, 500 Global, Alchemist Accelerator.

        - ANGEL_GROUP: Networks of individual angel investors who collaborate to source, evaluate, and co-invest in early-stage companies. Capital deployed deal-by-deal by members rather than through a single commingled institutional fund. Members often pay dues and attend regular pitch meetings. Logic triggers: angel network, angel group, member dues, pitch meetings, deal-by-deal syndicates, member-led diligence. Examples: Tech Coast Angels, New York Angels, Keiretsu Forum, Band of Angels, Golden Seeds.

        - INDIVIDUAL_ANGEL: High-net-worth individuals who invest personal capital directly into early-stage companies, typically without formal fund structures. Often former founders, executives, or operators who provide mentorship alongside capital. Logic triggers: angel investor, personal investment, individual check, former founder, executive investor. Examples: Naval Ravikant, Elad Gil, Ron Conway (individual capacity). Note: Distinct from ANGEL_GROUP (organized networks) and FAMILY_OFFICE (formal investment staff).

        - VENTURE_STUDIO: Organizations that systematically create and build companies internally by generating ideas, recruiting founding teams, and providing shared operational resources. Hold substantial ownership at inception and invest primarily through company creation rather than external deal sourcing. Logic triggers: venture studio, company builder, startup studio, internal company creation, co-founding teams, shared services model. Examples: Atomic, Rocket Internet, Hexa (eFounders), Betaworks, High Alpha.

        - GROWTH_EQUITY: Investment firms making large minority equity investments in mature, high-growth private companies with proven business models and revenue scale. Capital used for operational expansion, balance-sheet strengthening, or pre-IPO positioning (not early-stage runway extension). Typically $50M+ checks for 15-30% ownership. Logic triggers: expansion capital, late-stage/Series C+, growth round, PIPE, pre-IPO, revenue scale, proven unit economics. Examples: General Atlantic, TCV, Summit Partners, TA Associates, Dragoneer, Iconiq Growth.

        - PRIVATE_EQUITY: Firms primarily focused on control-oriented investments in mature companies: leveraged buyouts, take-privates, control recapitalizations, and operationally driven value creation. Control is the dominant strategy identity. Typically uses leverage and active operational involvement. Logic triggers: buyout, majority stake, LBO, take-private, control recap, platform acquisition, add-on, carve-out, sponsor-backed, operating partner. Examples: Thoma Bravo, Vista Equity Partners, Silver Lake, KKR, Blackstone, Carlyle, Apollo.

        - CROSSOVER_FUND: Investment firms for which public and private investing are both explicit core firm-level strategies. Usually these firms describe themselves as investing across public and private markets and maintain durable, substantial private exposure as part of the main platform. Use only when public and private investing are clearly co-equal parts of the firm''s identity. Examples: Tiger Global, Coatue, D1 Capital Partners, Whale Rock, Altimeter Capital.

        - HEDGE_FUND: Investment managers whose primary institutional identity is liquid public-markets investing (long/short equities, event-driven, macro, quant). Default here when the firm is public-markets-first, even if it also does some private deals. Only move to CROSSOVER_FUND when public and private investing are explicitly presented as co-equal core strategies. Examples: Viking Global, Lone Pine Capital, Third Point, Pershing Square, Citadel, Point72, Elliott Management.

        - FAMILY_OFFICE: Organizations deploying proprietary capital on behalf of one or more families, typically evergreen, investing across asset classes including direct private investments without raising third-party institutional funds. May be single-family (SFO) or multi-family (MFO). Logic triggers: single/multi-family office, private investment office, family wealth. Examples: Emerson Collective, Cascade Investment, Bezos Expeditions, Pritzker Group.

        - SOVEREIGN_WEALTH_FUND: State-owned investment funds managing national wealth (often from commodities or foreign exchange reserves) investing globally across public and private markets with profit-seeking mandate. May invest directly or through LP commitments. Logic triggers: sovereign wealth fund, state-owned investment, national investment authority, government investment corporation. Examples: GIC (Singapore), Temasek, ADIA, Public Investment Fund (PIF), Mubadala, Qatar Investment Authority.

        - PENSION_FUND: Institutional investors managing retirement assets for public or private sector beneficiaries. Allocate to external managers via LP commitments and may execute direct/co-investments. Long-term horizon matching liability profiles. Logic triggers: retirement system, pension plan, teachers retirement, employees retirement, defined benefit. Examples: CalPERS, CalSTRS, Ontario Teachers'' Pension Plan, CPP Investments, CDPQ.

        - ENDOWMENT: Investment offices managing endowment capital for universities, hospitals, museums, and foundations to support long-term missions. Allocate across diversified asset classes primarily via external managers with selective co-investments. Logic triggers: endowment, university investments, foundation investments, investment office, charitable trust. Examples: Yale Investments Office, Harvard Management Company, Stanford Management Company, Ford Foundation, Wellcome Trust.

        - INVESTMENT_BANK: Regulated financial institutions with core business in securities underwriting, capital markets, and M&A advisory, even if they also operate principal investing or merchant banking divisions. Classify by primary institutional identity. Logic triggers: underwriting, capital markets, sell-side advisory, M&A advisory, broker-dealer, merchant banking division. Examples: Goldman Sachs, Morgan Stanley, JPMorgan, Bank of America Securities, Barclays, Lazard.

        - ASSET_MANAGER: Firms managing diversified portfolios for retail and institutional clients via mutual funds, ETFs, separate accounts. May participate in late-stage private rounds opportunistically, but defining identity is large-scale client asset management. Logic triggers: mutual funds, ETFs, long-only, retail distribution, index funds. Examples: BlackRock, T. Rowe Price, Vanguard, Capital Group, Wellington, Baillie Gifford.

        - PRIVATE_DEBT: Managers providing non-bank lending and credit solutions: venture debt, growth debt, direct lending, mezzanine, structured credit. Primary return from interest/fees rather than equity appreciation, often with warrant coverage. Logic triggers: venture debt, growth debt, direct lending, credit fund, mezzanine, senior secured, warrant coverage, PIK interest. Examples: Hercules Capital, TriplePoint Capital, Western Technology Investment, Ares Credit, Golub Capital, Blue Owl Credit.

        - SECONDARY_FUND: Firms specializing in purchasing existing fund interests, portfolios, or direct stakes from current investors/fund managers in secondary transactions. Provides liquidity rather than funding new issuances. Includes LP-led secondaries, GP-led continuation funds, direct secondaries. Logic triggers: secondary market, LP interest purchase, GP-led secondary, continuation fund, liquidity solution, tender offer. Examples: Lexington Partners, Ardian, Coller Capital, HarbourVest (secondary), Blackstone Strategic Partners.

        - FUND_OF_FUNDS: Investment managers primarily allocating capital to portfolios of external investment funds (manager selection) rather than direct operating company investments. May do co-investments but fund allocation is dominant. Logic triggers: fund of funds, manager selection, GP relationships, fund commitments, portfolio of funds. Examples: HarbourVest Partners, StepStone Group, Horsley Bridge, Adams Street Partners, Pantheon, Hamilton Lane.

        - GOVERNMENT: Public or quasi-public entities with primary mandate in economic development, innovation policy, job creation, or industrial strategy rather than pure profit maximization. May provide grants, loan guarantees, subsidized financing, or mission-driven equity. Includes development finance institutions (DFIs). Logic triggers: development finance institution, economic development agency, innovation agency, development bank, SBIC program. Examples: British Business Bank, BDC Capital, European Investment Fund (EIF), KfW, In-Q-Tel.

        - OTHER: Investors that don''t fit standard categories above. Use sparingly - most investors should map to a defined category.

        - UNKNOWN: Unable to determine investor type from available information. Use when data is insufficient for classification.'
