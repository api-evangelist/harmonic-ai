      - name: id_or_urn
        in: path
        required: true
        schema:
          anyOf:
          - type: integer
          - type: string
            format: uuid
          - type: string
          title: Id Or Urn
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Cursor for pagination
          title: Cursor
        description: Cursor for pagination
      - name: exclude_snapshots
        in: query
        required: false
        schema:
          type: boolean
          description: Deprecated. Snapshot data is no longer materialized; this flag is retained only for backwards compatibility and has no effect on the fetch path.
          default: false
          title: Exclude Snapshots
        description: Deprecated. Snapshot data is no longer materialized; this flag is retained only for backwards compatibility and has no effect on the fetch path.
        deprecated: true
      - name: page
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          description: Page number
          title: Page
        description: Page number
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: Page size
          default: 50
          title: Size
        description: Page size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchOutput'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
