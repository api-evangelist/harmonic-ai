openapi: 3.1.0
info:
  title: Harmonic.ai Public enrichment API
  version: 0.0.1
  description: Public API documentation for Harmonic.ai.
tags:
- name: enrichment
paths:
  /companies:
    post:
      tags:
      - enrichment
      summary: Get Company By Identifiers
      operationId: get_company_by_identifiers_companies_post
      parameters:
      - name: linkedin_url
        in: query
        required: false
        schema:
          type: string
          description: Company LinkedIn profile URL.
          title: Linkedin Url
        description: Company LinkedIn profile URL.
        example: https://www.linkedin.com/company/facebook
      - name: website_url
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Company website URL.
          title: Website Url
        description: Company website URL.
        example: https://www.harmonic.ai
      - name: twitter_url
        in: query
        required: false
        schema:
          type: string
          description: Company twitter URL.
          title: Twitter Url
        description: Company twitter URL.
        example: twitter.com/facebook
      - name: crunchbase_url
        in: query
        required: false
        schema:
          type: string
          description: Company Crunchbase profile URL.
          title: Crunchbase Url
        description: Company Crunchbase profile URL.
        example: https://www.crunchbase.com/organization/amazon
      - name: pitchbook_url
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Company, Investor, or Advisor Pitchbook profile URL.
          title: Pitchbook Url
        description: Company, Investor, or Advisor Pitchbook profile URL.
        example: https://pitchbook.com/profiles/company/11919-79
      - name: instagram_url
        in: query
        required: false
        schema:
          type: string
          description: Company Instagram profile URL.
          title: Instagram Url
        description: Company Instagram profile URL.
        example: https://www.instagram.com/allbirds
      - name: facebook_url
        in: query
        required: false
        schema:
          type: string
          description: Company Facebook profile URL.
          title: Facebook Url
        description: Company Facebook profile URL.
        example: https://www.facebook.com/weareallbirds/
      - name: angellist_url
        in: query
        required: false
        schema:
          type: string
          description: Company Angellist profile URL.
          title: Angellist Url
        description: Company Angellist profile URL.
        example: https://angel.co/company/amazon
      - name: monster_url
        in: query
        required: false
        schema:
          type: string
          description: Company Monster profile URL.
          title: Monster Url
        description: Company Monster profile URL.
        example: https://www.monster.com/company/profiles/ikea/
      - name: indeed_url
        in: query
        required: false
        schema:
          type: string
          description: Company Indeed profile URL.
          title: Indeed Url
        description: Company Indeed profile URL.
        example: indeed.com/cmp/Ikea
      - name: stackoverflow_url
        in: query
        required: false
        schema:
          type: string
          description: Company StackOverflow profile URL.
          title: Stackoverflow Url
        description: Company StackOverflow profile URL.
        example: https://www.stackoverflow.com/jobs/companies/3db-labs
      - name: glassdoor_url
        in: query
        required: false
        schema:
          type: string
          description: Company Glassdoor profile URL.
          title: Glassdoor Url
        description: Company Glassdoor profile URL.
        example: https://www.glassdoor.com/Overview/Working-at-3rd-Digital-EI_IE3045173.11,22.htm
      - name: website_domain
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Company website domain.
          title: Website Domain
        description: Company website domain.
        example: harmonic.ai
      - name: include_fields
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Company fields to fetch.
          title: Include Fields
        description: Company fields to fetch.
      - name: enrich_missing_company
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Enrich Missing Company
      - name: hide_non_surfaceable_company
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Hide Non Surfaceable Company
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/CompanyOutput'
                - type: 'null'
                title: Response Get Company By Identifiers Companies Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /persons:
    post:
      tags:
      - enrichment
      summary: Get Person By Canonical
      operationId: get_person_by_canonical_persons_post
      parameters:
      - name: linkedin_url
        in: query
        required: false
        schema:
          type: string
          description: Linkedin profile URL.
          title: Linkedin Url
        description: Linkedin profile URL.
        example: https://www.linkedin.com/in/elonmusk
      - name: email
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Email address for person lookup. Used as fallback when linkedin_url is not provided or yields no result.
          title: Email
        description: Email address for person lookup. Used as fallback when linkedin_url is not provided or yields no result.
        example: john.doe@example.com
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/PersonEnrichmentOutput'
                - type: 'null'
                title: Response Get Person By Canonical Persons Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /enrichment_status:
    get:
      tags:
      - enrichment
      summary: Get Enrichment Request Status
      operationId: get_enrichment_request_status_enrichment_status_get
      parameters:
      - name: ids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
          default: []
          title: Ids
      - name: urns
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
          title: Urns
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnrichmentOutput'
                title: Response Get Enrichment Request Status Enrichment Status Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    SchoolOutput:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        linkedin_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Linkedin Url
        logo_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Logo Url
        entity_urn:
          type: string
          pattern: urn:harmonic:school:id
          title: SchoolUrn
      additionalProperties: false
      type: object
      required:
      - entity_urn
      title: SchoolOutput
    LanguageMetadata:
      properties:
        name:
          type: string
          title: Name
        proficiency:
          anyOf:
          - type: string
          - type: 'null'
          title: Proficiency
      additionalProperties: false
      type: object
      required:
      - name
      title: LanguageMetadata
    ContactMetadata:
      properties:
        emails:
          items:
            type: string
          type: array
          title: Emails
          default: []
        phone_numbers:
          items:
            type: string
          type: array
          title: Phone Numbers
          default: []
        exec_emails:
          items:
            type: string
          type: array
          title: Exec Emails
          default: []
        primary_email:
          anyOf:
          - type: string
          - type: 'null'
          title: Primary Email
        primary_email_person_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Primary Email Person Id
      additionalProperties: false
      type: object
      title: ContactMetadata
    ValuationInfo:
      properties:
        value:
          anyOf:
          - type: integer
          - type: 'null'
          title: Value
        source:
          anyOf:
          - $ref: '#/components/schemas/ValuationSource'
          - type: 'null'
        source_details:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Details
      additionalProperties: false
      type: object
      title: ValuationInfo
      description: Base valuation info - used for per-funding-round valuation.
    SocialMetadata:
      properties:
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
        follower_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Follower Count
        username:
          anyOf:
          - type: string
          - type: 'null'
          title: Username
        status:
          anyOf:
          - $ref: '#/components/schemas/SocialStatus'
          - type: 'null'
      additionalProperties: false
      type: object
      title: SocialMetadata
    NotableFollowerOutput:
      properties:
        follower_urn:
          anyOf:
          - type: string
            pattern: urn:harmonic:investor:id
            title: InvestorUrn
          - type: string
            pattern: urn:harmonic:person:id
            title: PersonUrn
          title: Follower Urn
        follower_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Follower Name
        firm_urn:
          anyOf:
          - type: string
            pattern: urn:harmonic:investor:id
            title: InvestorUrn
          - type: 'null'
          title: Firm Urn
        firm_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Firm Name
        followed_urn:
          anyOf:
          - type: string
            pattern: urn:harmonic:person:id
            title: PersonUrn
          - type: string
            pattern: urn:harmonic:company:id
            title: CompanyUrn
          title: Followed Urn
        followed_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Followed Name
        follow_observed_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Follow Observed At
      additionalProperties: false
      type: object
      required:
      - follower_urn
      - followed_urn
      title: NotableFollowerOutput
      description: 'A tracked notable account (firm or individual investor) following a

        person at the company, or the company''s own X handle.'
    RoleType:
      type: string
      enum:
      - FOUNDER
      - CEO
      - EXECUTIVE
      - OPERATOR
      - INTERN
      - ALUMNI
      - ADVISER
      - EMPLOYEE
      - INVESTOR
      - FALSE_POSITION
      title: RoleType
    UnstandardizedExperienceMetadata-Output:
      properties:
        contact:
          anyOf:
          - $ref: '#/components/schemas/ContactMetadata'
          - type: 'null'
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        department:
          anyOf:
          - $ref: '#/components/schemas/Department'
          - type: 'null'
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        start_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Start Date
        end_date:
          anyOf:
          - type: string
          - type: 'null'
          title: End Date
        is_current_position:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Current Position
        location:
          anyOf:
          - type: string
          - type: 'null'
          title: Location
        role_type:
          anyOf:
          - $ref: '#/components/schemas/RoleType'
          - type: 'null'
        company:
          anyOf:
          - type: string
          - type: string
            pattern: urn:harmonic:company:id
            title: CompanyUrn
          title: Company
      additionalProperties: false
      type: object
      required:
      - company
      title: UnstandardizedExperienceMetadata
    Attachments:
      properties:
        value:
          items:
            $ref: '#/components/schemas/FounderProvidedAttachment'
          type: array
          title: Value
        source:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
        submitted_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Submitted At
      additionalProperties: false
      type: object
      title: Attachments
    PersonMetadata-Output:
      properties:
        contact:
          anyOf:
          - $ref: '#/components/schemas/ContactMetadata'
          - type: 'null'
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        department:
          anyOf:
          - $ref: '#/components/schemas/Department'
          - type: 'null'
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        start_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Start Date
        end_date:
          anyOf:
          - type: string
          - type: 'null'
          title: End Date
        is_current_position:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Current Position
        location:
          anyOf:
          - type: string
          - type: 'null'
          title: Location
        role_type:
          anyOf:
          - $ref: '#/components/schemas/RoleType'
          - type: 'null'
        person:
          type: string
          pattern: urn:harmonic:person:id
          title: PersonUrn
        person_company_urn:
          anyOf:
          - type: string
            pattern: urn:harmonic:(urn:harmonic:person:A, urn:harmonic:company:B):id
            title: PersonCompanyComplexUrn
          - type: 'null'
          title: Person Company Urn
      additionalProperties: false
      type: object
      required:
      - person
      title: PersonMetadata
    FundingCompletionStatus:
      type: string
      enum:
      - COMPLETED
      - CONFIRMED_UNDISCLOSED
      title: FundingCompletionStatus
    services__midtier__schemas__person__Highlight-Output:
      properties:
        category:
          $ref: '#/components/schemas/PersonHighlightCategory'
        date_added:
          anyOf:
          - type: string
          - type: 'null'
          title: Date Added
        text:
          anyOf:
          - type: string
          - type: 'null'
          title: Text
        company_urn:
          anyOf:
          - type: string
            pattern: urn:harmonic:company:id
            title: CompanyUrn
          - type: 'null'
          title: Company Urn
      additionalProperties: false
      type: object
      required:
      - category
      title: Highlight
    PersonEnrichmentOutput:
