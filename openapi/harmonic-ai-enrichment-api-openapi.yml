          - $ref: '#/components/schemas/ContactMetadata'
          - type: 'null'
          bq_to_snowflake_dsl:
            snowflake:
              field_type: object
          source_big_table_column_key:
          - contact_emails
          - contact_numbers
          - primary_email
        location:
