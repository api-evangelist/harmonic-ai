      type: object
      required:
      - entity_urn
      - id
      title: PersonEnrichmentOutput
    StandardizedDegree:
      type: string
      enum:
      - PHD
      - DOCTOR_OF_MEDICINE
      - JURIS_DOCTOR
      - OTHER_DOCTORATE
      - MASTER_OF_BUSINESS_ADMINISTRATION
      - MASTERS_DEGREE
      - BACHELORS_DEGREE
