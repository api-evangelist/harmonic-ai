openapi: 3.1.0
info:
  title: Harmonic.ai Public persons API
  version: 0.0.1
  description: Public API documentation for Harmonic.ai.
tags:
- name: persons
paths:
  /persons:
    get:
      tags:
      - persons
      summary: Batch Get Persons By Id Or Urn
      operationId: batch_get_persons_by_id_or_urn_persons_get
      parameters:
      - name: ids
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
          default: []
          title: Ids
      - name: urns
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
          title: Urns
      - name: company_context_urns
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Company Context Urns
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonOutput'
                title: Response Batch Get Persons By Id Or Urn Persons Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - persons
      summary: Get Person By Canonical
      operationId: get_person_by_canonical_persons_post
      parameters:
      - name: linkedin_url
        in: query
        required: false
        schema:
          type: string
          description: Linkedin profile URL.
          title: Linkedin Url
        description: Linkedin profile URL.
        example: https://www.linkedin.com/in/elonmusk
      - name: email
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Email address for person lookup. Used as fallback when linkedin_url is not provided or yields no result.
          title: Email
        description: Email address for person lookup. Used as fallback when linkedin_url is not provided or yields no result.
        example: john.doe@example.com
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/PersonEnrichmentOutput'
                - type: 'null'
                title: Response Get Person By Canonical Persons Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /persons/entries:
    post:
      tags:
      - persons
      summary: Global Import People
      description: Import people with global custom field values
      operationId: global_import_people_persons_entries_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonListEntriesBatchImportInput'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportPeopleCanonicalsOutput'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /persons/custom_fields:
    get:
      tags:
      - persons
      summary: Get Global Custom Fields
      operationId: get_global_custom_fields_persons_custom_fields_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /persons/custom_field:
    post:
      tags:
      - persons
      summary: Create Global Custom Field
      operationId: create_global_custom_field_persons_custom_field_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonListCustomFieldInput'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - persons
      summary: Update Global Custom Field
      operationId: update_global_custom_field_persons_custom_field_put
      parameters:
      - name: custom_field_urn
        in: query
        required: true
        schema:
          anyOf:
          - type: string
            pattern: urn:harmonic:person_list_custom_field:id
            title: PersonListCustomFieldUrn
          - type: string
            pattern: urn:harmonic:list_attribute:id
            title: ListAttributeUrn
          - type: string
            pattern: urn:harmonic:record_attribute:id
            title: RecordAttributeUrn
          description: Custom field URN
          title: Custom Field Urn
        description: Custom field URN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePersonListCustomFieldInput'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - persons
      summary: Delete Custom Field
      operationId: delete_custom_field_persons_custom_field_delete
      parameters:
      - name: custom_field_urn
        in: query
        required: true
        schema:
          anyOf:
          - type: string
            pattern: urn:harmonic:person_list_custom_field:id
            title: PersonListCustomFieldUrn
          - type: string
            pattern: urn:harmonic:list_attribute:id
            title: ListAttributeUrn
          - type: string
            pattern: urn:harmonic:record_attribute:id
            title: RecordAttributeUrn
          description: Custom field URN
          title: Custom Field Urn
        description: Custom field URN
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceUrnResponse_Union_PersonListCustomFieldUrn__ListAttributeUrn__RecordAttributeUrn__'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /persons/{id_or_urn}:
    get:
      tags:
      - persons
      summary: Get Person By Id Or Urn
      operationId: get_person_by_id_or_urn_persons__id_or_urn__get
      parameters:
      - name: id_or_urn
        in: path
        required: true
        schema:
          anyOf:
          - type: integer
          - type: string
            format: uuid
          - type: string
          title: Id Or Urn
      - name: company_context_urns
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Company Context Urns
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/PersonOutput'
                - type: 'null'
                title: Response Get Person By Id Or Urn Persons  Id Or Urn  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /persons/batchGet:
    post:
      tags:
      - persons
      summary: Batch Get Person By Id Or Urn Post Method
      operationId: batch_get_person_by_id_or_urn_post_method_persons_batchGet_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonBatchGetInput'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PersonOutput'
                type: array
                title: Response Batch Get Person By Id Or Urn Post Method Persons Batchget Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /persons/attachments:
    post:
      tags:
      - persons
      summary: Batch Get Attachments
      operationId: batch_get_attachments_persons_attachments_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchPersonAttachmentsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BatchPersonAttachmentsOutput'
                type: array
                title: Response Batch Get Attachments Persons Attachments Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - persons
      summary: Batch Delete Attachments
      operationId: batch_delete_attachments_persons_attachments_delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchDeleteAttachmentsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: integer
                title: Response Batch Delete Attachments Persons Attachments Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /persons/{id_or_urn}/attachments:
    post:
      tags:
      - persons
      summary: Batch Create Attachments
      operationId: batch_create_attachments_persons__id_or_urn__attachments_post
      parameters:
      - name: id_or_urn
        in: path
        required: true
        schema:
          anyOf:
          - type: integer
          - type: string
            format: uuid
          - type: string
          title: Id Or Urn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCreateAttachmentsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCreateAttachmentsOutput'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - persons
      summary: Batch Complete Upload
      operationId: batch_complete_upload_persons__id_or_urn__attachments_put
      parameters:
      - name: id_or_urn
        in: path
        required: true
        schema:
          anyOf:
          - type: integer
          - type: string
            format: uuid
          - type: string
          title: Id Or Urn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCompleteUploadRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentMetadataListOutput'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - persons
      summary: Link Attachments
      operationId: link_attachments_persons__id_or_urn__attachments_patch
      parameters:
      - name: id_or_urn
        in: path
        required: true
        schema:
          anyOf:
          - type: integer
          - type: string
            format: uuid
          - type: string
          title: Id Or Urn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkAttachmentsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttachmentMetadataOutput'
                title: Response Link Attachments Persons  Id Or Urn  Attachments Patch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /persons/{id_or_urn}/attachments/{urn}:
    get:
      tags:
      - persons
      summary: Get Attachment Content
      operationId: get_attachment_content_persons__id_or_urn__attachments__urn__get
      parameters:
      - name: id_or_urn
        in: path
        required: true
        schema:
          anyOf:
          - type: integer
          - type: string
            format: uuid
          - type: string
          title: Id Or Urn
      - name: urn
        in: path
        required: true
        schema:
          type: string
          title: Urn
      - name: preview
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Preview
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAttachmentContentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - persons
      summary: Delete Attachment
      operationId: delete_attachment_persons__id_or_urn__attachments__urn__delete
      parameters:
      - name: id_or_urn
        in: path
        required: true
        schema:
          anyOf:
          - type: integer
          - type: string
            format: uuid
          - type: string
          title: Id Or Urn
      - name: urn
        in: path
        required: true
        schema:
          type: string
          title: Urn
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: boolean
                title: Response Delete Attachment Persons  Id Or Urn  Attachments  Urn  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    PersonSelectCustomFieldValueInput:
      properties:
        value:
          items:
            anyOf:
            - type: string
              pattern: urn:harmonic:user:id
              title: UserUrn
            - type: string
          type: array
          title: Value
          default: []
      additionalProperties: false
      type: object
      title: PersonSelectCustomFieldValueInput
    RecordReferenceListCustomFieldMetadata:
      properties:
        record_type_urn:
          type: string
          title: Record Type Urn
        allow_multiple:
          type: boolean
          title: Allow Multiple
        mode:
          anyOf:
          - type: string
          - type: 'null'
          title: Mode
      additionalProperties: false
      type: object
      required:
      - record_type_urn
      - allow_multiple
      title: RecordReferenceListCustomFieldMetadata
    SchoolOutput:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        linkedin_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Linkedin Url
        logo_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Logo Url
        entity_urn:
          type: string
          pattern: urn:harmonic:school:id
          title: SchoolUrn
      additionalProperties: false
      type: object
      required:
      - entity_urn
      title: SchoolOutput
    PersonListEntryInput:
      properties:
        person_urn:
          anyOf:
          - type: string
            pattern: urn:harmonic:person:id
            title: PersonUrn
          - type: 'null'
          title: Person Urn
        canonical:
          anyOf:
          - $ref: '#/components/schemas/PersonCanonicalParameter'
          - type: 'null'
        values:
          items:
            $ref: '#/components/schemas/PersonFieldInputValue'
          type: array
          title: Values
          default: []
        created_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created At
      additionalProperties: false
      type: object
      title: PersonListEntryInput
    BatchDeleteAttachmentsRequest:
      properties:
        attachment_urns:
          items:
            type: string
            pattern: urn:harmonic:user_uploaded_content:id
            title: UserUploadedContentUrn
          type: array
          title: Attachment Urns
      additionalProperties: false
      type: object
      required:
      - attachment_urns
      title: BatchDeleteAttachmentsRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    NumberListCustomFieldValueFormat:
      type: string
      enum:
      - NUMBER
      - PERCENT
      - US_DOLLAR
      title: NumberListCustomFieldValueFormat
    LanguageMetadata:
      properties:
        name:
          type: string
          title: Name
        proficiency:
          anyOf:
          - type: string
          - type: 'null'
          title: Proficiency
      additionalProperties: false
      type: object
      required:
      - name
      title: LanguageMetadata
    ContactMetadata:
      properties:
        emails:
          items:
            type: string
          type: array
          title: Emails
          default: []
        phone_numbers:
          items:
            type: string
          type: array
          title: Phone Numbers
          default: []
        exec_emails:
          items:
            type: string
          type: array
          title: Exec Emails
          default: []
        primary_email:
          anyOf:
          - type: string
          - type: 'null'
          title: Primary Email
        primary_email_person_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Primary Email Person Id
      additionalProperties: false
      type: object
      title: ContactMetadata
    PersonFieldInputValue:
      properties:
        custom_field_urn:
          anyOf:
          - type: string
            pattern: urn:harmonic:person_list_custom_field:id
            title: PersonListCustomFieldUrn
          - type: string
            pattern: urn:harmonic:list_attribute:id
            title: ListAttributeUrn
          - type: string
            pattern: urn:harmonic:record_attribute:id
            title: RecordAttributeUrn
          title: Custom Field Urn
        data:
          anyOf:
          - $ref: '#/components/schemas/CheckboxListCustomFieldValue'
          - $ref: '#/components/schemas/NumberListCustomFieldValue'
          - $ref: '#/components/schemas/TextListCustomFieldValue'
          - $ref: '#/components/schemas/SingleListSelectCustomFieldValue'
          - $ref: '#/components/schemas/MultiSelectListCustomFieldValue'
          - $ref: '#/components/schemas/PersonSelectCustomFieldValue'
          - $ref: '#/components/schemas/DateListCustomFieldValue'
          - $ref: '#/components/schemas/WebsiteListCustomFieldValue'
          - $ref: '#/components/schemas/StatusListCustomFieldValue'
          - $ref: '#/components/schemas/PersonSelectCustomFieldValueInput'
          - $ref: '#/components/schemas/RecordReferenceListCustomFieldValue'
          title: Data
      additionalProperties: false
      type: object
      required:
      - custom_field_urn
      - data
      title: PersonFieldInputValue
    SocialMetadata:
      properties:
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
        follower_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Follower Count
        username:
          anyOf:
          - type: string
          - type: 'null'
          title: Username
        status:
          anyOf:
          - $ref: '#/components/schemas/SocialStatus'
          - type: 'null'
      additionalProperties: false
      type: object
      title: SocialMetadata
    RecordReferenceListCustomFieldValue:
      properties:
        value:
          items:
            type: string
          type: array
          title: Value
          default: []
      additionalProperties: false
      type: object
      title: RecordReferenceListCustomFieldValue
    ImportPeopleCanonicalsOutput:
      properties:
        user_people_import_urn:
          type: string
          pattern: urn:harmonic:user_people_import:id
          title: UserPeopleImportUrn
        total_people_count:
          type: integer
          title: Total People Count
        people_found_count:
          type: integer
          title: People Found Count
        people_not_found_count:
          type: integer
          title: People Not Found Count
        people_invalid_count:
          type: integer
          title: People Invalid Count
      additionalProperties: false
      type: object
      required:
      - user_people_import_urn
      - total_people_count
      - people_found_count
      - people_not_found_count
      - people_invalid_count
      title: ImportPeopleCanonicalsOutput
    BatchCreateAttachmentsOutput:
      properties:
        attachments:
          items:
            $ref: '#/components/schemas/CreateAttachmentOutput'
          type: array
          title: Attachments
      additionalProperties: false
      type: object
      required:
      - attachments
      title: BatchCreateAttachmentsOutput
    PersonListEntriesBatchImportInput:
      properties:
        entries:
          items:
            $ref: '#/components/schemas/PersonListEntryInput'
          type: array
          title: Entries
      additionalProperties: false
      type: object
      required:
      - entries
      title: PersonListEntriesBatchImportInput
    NotableFollowerOutput:
      properties:
        follower_urn:
          anyOf:
          - type: string
            pattern: urn:harmonic:investor:id
            title: InvestorUrn
          - type: string
            pattern: urn:harmonic:person:id
            title: PersonUrn
          title: Follower Urn
        follower_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Follower Name
        firm_urn:
          anyOf:
          - type: string
            pattern: urn:harmonic:investor:id
            title: InvestorUrn
          - type: 'null'
          title: Firm Urn
        firm_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Firm Name
        followed_urn:
          anyOf:
          - type: string
            pattern: urn:harmonic:person:id
            title: PersonUrn
          - type: string
            pattern: urn:harmonic:company:id
            title: CompanyUrn
          title: Followed Urn
        followed_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Followed Name
        follow_observed_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Follow Observed At
      additionalProperties: false
      type: object
      required:
      - follower_urn
      - followed_urn
      title: NotableFollowerOutput
      description: 'A tracked notable account (firm or individual investor) following a

        person at the company, or the company''s own X handle.'
    SingleListSelectCustomFieldValue:
      properties:
        value:
          anyOf:
          - type: string
            pattern: urn:harmonic:select_list_custom_field_value_option:id
            title: SelectListCustomFieldValueOptionUrn
          - type: 'null'
          title: Value
      additionalProperties: false
      type: object
      title: SingleListSelectCustomFieldValue
    RoleType:
      type: string
      enum:
      - FOUNDER
      - CEO
      - EXECUTIVE
      - OPERATOR
      - INTERN
      - ALUMNI
      - ADVISER
      - EMPLOYEE
      - INVESTOR
      - FALSE_POSITION
      title: RoleType
    UnstandardizedExperienceMetadata-Output:
      properties:
        contact:
          anyOf:
          - $ref: '#/components/schemas/ContactMetadata'
          - type: 'null'
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        department:
          anyOf:
          - $ref: '#/components/schemas/Department'
          - type: 'null'
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        start_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Start Date
        end_date:
          anyOf:
          - type: string
          - type: 'null'
          title: End Date
        is_current_position:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Current Position
        location:
          anyOf:
          - type: string
          - type: 'null'
          title: Location
        role_type:
          anyOf:
          - $ref: '#/components/schemas/RoleType'
          - type: 'null'
        company:
          anyOf:
          - type: string
          - type: string
            pattern: urn:harmonic:company:id
            title: CompanyUrn
          title: Company
      additionalProperties: false
      type: object
      required:
      - company
      title: UnstandardizedExperienceMetadata
    services__midtier__schemas__person__Highlight-Output:
      properties:
        category:
          $ref: '#/components/schemas/PersonHighlightCategory'
        date_added:
          anyOf:
          - type: string
          - type: 'null'
          title: Date Added
        text:
          anyOf:
          - type: string
          - type: 'null'
          title: Text
        company_urn:
          anyOf:
          - type: string
            pattern: urn:harmonic:company:id
            title: CompanyUrn
          - type: 'null'
          title: Company Urn
      additionalProperties: false
      type: object
      required:
      - category
      title: Highlight
    SelectListCustomFieldValueOptionInputSchema:
      properties:
        urn:
          type: string
          pattern: urn:harmonic:select_list_custom_field_value_option:id
          title: SelectListCustomFieldValueOptionUrn
        name:
          type: string
          title: Name
        color:
          type: string
          title: Color
        default:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Default
          default: false
      additionalProperties: false
      type: object
      required:
