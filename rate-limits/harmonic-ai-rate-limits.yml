    surface: REST (api.harmonic.ai)
    window: 1 second
    limit: 10
    unit: requests
    burst: null
    status_on_exhaustion: 429
    counted: >-
      Only successful 200 responses count against the allowance; error responses are not billed
      against the per-second limit.
    headers:
      - name: X-RateLimit-Limit-Second
        meaning: Maximum requests permitted in the current one-second window.
        observed_value: 10
      - name: X-RateLimit-Remaining-Second
        meaning: Requests still available in the current one-second window.
    retry_after: null
    retry_after_note: >-
      No Retry-After header is documented. With a one-second window the correct client behavior is
      to back off for the remainder of the second and retry; exponential backoff on repeated 429s.
    source: https://console.harmonic.ai/docs/api-reference/introduction
