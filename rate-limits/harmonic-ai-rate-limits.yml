generated: '2026-08-14'
method: searched
source: https://console.harmonic.ai/docs/api-reference/introduction
corroboration: >-
  Live unauthenticated probe of https://api.harmonic.ai/ and
  https://api.harmonic.ai/companies?website_domain=stripe.com on 2026-08-14 returned
  HTTP 403 with `server: kong/3.0.2` and `www-authenticate: Key realm="kong"`. Harmonic fronts
  its API with Kong 3.0.2, and the header family named in the docs
  (X-RateLimit-Limit-Second / X-RateLimit-Remaining-Second) is exactly what the Kong
  rate-limiting plugin emits in `second` window mode. The two agree.
confidence: medium-high
confidence_note: >-
  The numeric limit and header names come from Harmonic's API reference, whose host
  (console.harmonic.ai) is a client-rendered SPA — the page returns a 6,759-byte loading shell to
  any non-browser fetch, so the text could not be captured verbatim by this pipeline and was read
  from the indexed docs content. The values are corroborated by the observed Kong gateway (above)
  but have NOT been observed on a live 429 from this repo. Treat the header names as authoritative
  for client design and re-verify the number against an authenticated response before relying on it
  for capacity planning.
limit_count: 2
scopes:
