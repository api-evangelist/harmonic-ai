summary:
  first_party_sdk_count: 0
  third_party_package_count: 2
  note: >-
    Harmonic.ai publishes NO first-party client library in any public package registry as of
    2026-08-14. The provider's own integration story is: raw REST/GraphQL over api.harmonic.ai,
    the hosted MCP server at mcp.api.harmonic.ai, a public Postman workspace, and native
    Salesforce/HubSpot/Affinity connectors. Because no official SDK exists, this repo emits NO
    `SDKs` pointer in apis.yml — the ergonomics sdk_count check must read a genuine zero here.

