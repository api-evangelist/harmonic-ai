generated: '2026-08-14'
method: probed
source: https://console.harmonic.ai/docs/changelog
checked: '2026-08-14'
summary: >-
  Harmonic.ai publishes a changelog inside its docs console, but the page is not machine-readable:
  console.harmonic.ai is a client-rendered SPA that returns the same 6,759-byte application shell
  for every /docs/* path, including /docs/changelog. No dated entries, no feed, and no version
  identifiers can be captured without executing JavaScript. The ChangeLog link in apis.yml is
  therefore a real page that no agent, crawler or scorer can actually read.
scheme:
  api_versioning: unversioned-path
  note: >-
    The REST base https://api.harmonic.ai/ carries no version segment, and the published OpenAPI
    declares info.version "0.0.1" — a placeholder that has not moved across observations. There is
    no version identifier a consumer can pin, so the changelog is the only change signal available.
current_version:
  spec_declared: 0.0.1
  source: openapi/_original/harmonic-ai-openapi.json
  note: >-
    info.version has read "0.0.1" on every capture of this spec (2026-07-22 and 2026-08-14) while
    the operation count changed, so it does not track releases.
feeds:
  rss: null
  atom: null
  json: null
  probed:
    - url: https://console.harmonic.ai/docs/changelog
      status: 200
      body: SPA shell (HTML), not the changelog content
    - url: https://console.harmonic.ai/sitemap.xml
      status: 200
      body: SPA shell (HTML), not a sitemap
entries: []
entries_note: >-
  Deliberately empty. Recording a zero here is the honest result: the provider ships a changelog
  the pipeline cannot read, which is different from shipping no changelog at all.
observed_change:
  - detected: '2026-08-14'
    method: spec-diff
    change: additive
    breaking: false
    summary: >-
