      shows 7 new operations across 3 new paths, all under a new `investors` tag: investor
      attachments (batch get/create/delete, batch complete upload, link, get content, delete).
      No operations were removed and no existing operation changed. Path/operation counts moved
      58 -> 61 and 86 -> 93.
    added_operations:
      - batch_get_attachments_investors_attachments_post
      - batch_delete_attachments_investors_attachments_delete
      - batch_create_attachments_investors__id_or_urn__attachments_post
      - batch_complete_upload_investors__id_or_urn__attachments_put
      - link_attachments_investors__id_or_urn__attachments_patch
      - get_attachment_content_investors__id_or_urn__attachments__urn__get
      - delete_attachment_investors__id_or_urn__attachments__urn__delete
    removed_operations: []
    source: https://api.harmonic.ai/openapi.json
    note: >-
      This entry is a pipeline OBSERVATION derived by diffing two captures of the provider's own
      spec, not a provider-published changelog entry. It is recorded because the provider's own
      changelog is unreadable and this is the only dated, verifiable change evidence available.
gap:
  what: A machine-readable changelog.
  who_fixes_it: the provider
  how: >-
    Serve the changelog as static HTML, Markdown or an RSS/Atom feed at a stable URL outside the
    dashboard SPA, and move info.version off the "0.0.1" placeholder so consumers can pin a release.
