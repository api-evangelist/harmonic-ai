name: Harmonic.ai
description: >-
  Startup discovery and intelligence platform built on a proprietary database of 30M+ companies and 200M+ people,
  offering real-time funding data, headcount/traction metrics, team composition, and investor relationships via REST,
  GraphQL, and a hosted MCP server. Used by venture capital, growth equity, corporate development, and go-to-market
  teams to find, research, and qualify startups programmatically or through the console web app, Chrome extension,
  bulk data exports (BigQuery/Snowflake/S3), and CRM integrations (Salesforce/HubSpot/Affinity).
